services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cleansing-backend
    ports:
      - "8080:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /tmp/cleansing-data/uploads:/tmp/cleansing-data/uploads
      - /tmp/cleansing-data/outputs:/tmp/cleansing-data/outputs
      - /tmp/cleansing-data/sandbox:/tmp/cleansing-data/sandbox
    env_file:
      - .env
    restart: always