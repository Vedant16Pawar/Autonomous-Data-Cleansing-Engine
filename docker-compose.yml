version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cleansing-backend
    ports:
      - "80:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    env_file:
      - .env
    restart: always